# config.yaml.example
server:
  port: 40003
  mode: debug

database:
  host: localhost
  port: 5432
  user: your_username
  password: your_password
  dbname: your_database_name
  sslmode: disable

model:
  chat:
    # Supported providers:
    # - ark
    # - deepseek (OpenAI-compatible; default base_url is https://api.deepseek.com)
    # - openai (generic OpenAI-compatible)
    # - fake (tests/regression only; model selects fake scenario)
    provider: ark
    model: ep-your-chat-endpoint
    api_key: your_ark_api_key
    access_key: ""
    secret_key: ""
    base_url: https://ark.cn-beijing.volces.com/api/v3
    region: cn-beijing
    # Per LLM request timeout used by generation agents.
    # Long-running calls fail fast so async tasks can enter failed state and
    # record a context_gap instead of staying in generating forever.
    request_timeout_seconds: 60
    # Optional guardrails. Zero values mean disabled/unlimited.
    provider_timeout_seconds: 0
    task_budget_tokens: 0
    circuit_breaker_failure_threshold: 0
    circuit_breaker_cooldown_seconds: 60
    fallback:
      provider: ""
      model: ""
      api_key: ""
      access_key: ""
      secret_key: ""
      base_url: ""
      region: ""
      provider_timeout_seconds: 0
    # DeepSeek example:
    # provider: deepseek
    # model: deepseek-v4-pro
    # api_key: your_deepseek_api_key
    # access_key: ""
    # secret_key: ""
    # base_url: https://api.deepseek.com
    # region: ""
  embedding:
    # Supported providers: ark, openai, fake (tests/regression only).
    provider: ark
    model: ep-your-embedding-endpoint
    dimensions: 2000
    api_key: your_ark_api_key
    access_key: ""
    secret_key: ""
    base_url: https://ark.cn-beijing.volces.com/api/v3
    region: cn-beijing

suggestion:
  auto_dismiss_pending_days: 30

retention:
  # Default age window used by /api/v1/ops/retention/cleanup when the request
  # does not override retention_days.
  trace_retention_days: 30

job_runner:
  max_concurrency: 2
  # Optional per-tenant concurrency cap across background jobs. 0 means unlimited.
  tenant_max_concurrency: 0
  max_retries: 2
  retry_backoff_seconds: 5
  poll_interval_seconds: 2
  running_timeout_seconds: 900
  state_update_timeout_seconds: 10
  # Optional per job type overrides. Supported keys:
  # analyze, generate, document_process, document_reprocess,
  # knowledge_process, knowledge_reprocess.
  types: {}

gws:
  enabled: true
  command: gws
