# config.yaml.example
server:
  port: 8080
  mode: debug

database:
  host: localhost
  port: 5432
  user: your_username
  password: your_password
  dbname: your_database_name
  sslmode: disable

model:
  chat:
    # Supported providers:
    # - ark
    # - deepseek (OpenAI-compatible; default base_url is https://api.deepseek.com)
    # - openai (generic OpenAI-compatible)
    provider: ark
    model: ep-your-chat-endpoint
    api_key: your_ark_api_key
    access_key: ""
    secret_key: ""
    base_url: https://ark.cn-beijing.volces.com/api/v3
    region: cn-beijing
    # Per LLM request timeout used by generation agents.
    # Long-running calls fail fast so async tasks can enter failed state and
    # record a context_gap instead of staying in generating forever.
    request_timeout_seconds: 60
    # DeepSeek example:
    # provider: deepseek
    # model: deepseek-v4-pro
    # api_key: your_deepseek_api_key
    # access_key: ""
    # secret_key: ""
    # base_url: https://api.deepseek.com
    # region: ""
  embedding:
    provider: ark
    model: ep-your-embedding-endpoint
    dimensions: 2000
    api_key: your_ark_api_key
    access_key: ""
    secret_key: ""
    base_url: https://ark.cn-beijing.volces.com/api/v3
    region: cn-beijing

suggestion:
  auto_dismiss_pending_days: 30

gws:
  enabled: true
  command: gws
