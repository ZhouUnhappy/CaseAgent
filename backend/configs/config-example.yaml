# config.yaml.example
server:
  port: 8080
  mode: debug

database:
  host: localhost
  port: 5432
  user: your_username
  password: your_password
  dbname: your_database_name
  sslmode: disable

model:
  chat:
    provider: ark
    model: ep-your-chat-endpoint
    api_key: your_ark_api_key
    access_key: ""
    secret_key: ""
    base_url: https://ark.cn-beijing.volces.com/api/v3
    region: cn-beijing
  embedding:
    provider: ark
    model: ep-your-embedding-endpoint
    dimensions: 2000
    api_key: your_ark_api_key
    access_key: ""
    secret_key: ""
    base_url: https://ark.cn-beijing.volces.com/api/v3
    region: cn-beijing

gws:
  enabled: true
  command: gws
